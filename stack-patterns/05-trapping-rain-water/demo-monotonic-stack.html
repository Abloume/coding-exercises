<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>接雨水单调栈分步演示</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f6f7f9; color: #1f2933; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 20px; }
  h1 { text-align: center; font-size: 21px; color: #111827; margin: 6px 0 2px; }
  .subtitle { text-align: center; font-size: 12px; color: #6b7280; margin-bottom: 12px; }
  .cols { display: flex; flex-wrap: wrap; gap: 12px; }
  .card { background: #fff; border-radius: 10px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .canvas-card { flex: 1 1 420px; min-width: 300px; }
  .panel-card { flex: 1 1 320px; min-width: 260px; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg button { flex: 1 1 140px; min-height: 44px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .ex0 { border: 2px solid #059669; background: #059669; color: #fff; }
  .ex1 { border: 2px solid #d97706; background: #fff; color: #d97706; }
  .seg-note { text-align: center; color: #9ca3af; font-size: 12px; margin: 8px 0 4px; }
  svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: #374151; margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .lg { display: inline-block; width: 12px; height: 12px; border-radius: 2px; }
  .lg.red { border: 3px solid #e0533d; background: #fff; }
  .lg.blue { border: 3px solid #2563eb; background: #fff; }
  .lg.green { border: 3px solid #059669; background: #fff; }
  .lg.water { background: #60a5fa; opacity: .55; }
  .panel-title { font-size: 13px; font-weight: 700; color: #111827; }
  .step-label { font-size: 12px; color: #6b7280; margin: 4px 0 8px; }
  .desc { font-size: 13px; color: #374151; line-height: 1.7; min-height: 72px; }
  .box { background: #f3f4f6; border-radius: 8px; padding: 10px 12px; margin-top: 8px; font-size: 13px; line-height: 1.8; }
  .mono { font-family: Menlo, Consolas, monospace; }
  .total { color: #059669; font-weight: 700; }
  .calc { color: #2563eb; font-family: Menlo, Consolas, monospace; font-size: 12px; min-height: 18px; }
  .ctrls { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .ctrls button { flex: 1 1 70px; min-height: 44px; border: 1px solid #d1d5db; background: #fff; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .ctrls .play { flex: 1 1 90px; border: 1px solid #2563eb; background: #2563eb; color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <h1>接雨水 · 单调栈结算演示</h1>
  <div class="subtitle">弹出栈顶的那一刻答案确定 · 水量 = (min(左高, 右高) − 底高) × 宽度</div>

  <div class="cols">
    <div class="card canvas-card">
      <div class="seg">
        <button class="ex0" data-ex="0">例1 · 左墙矮 [2,1,3]</button>
        <button class="ex1" data-ex="1">例2 · 右墙矮 [3,1,2]</button>
      </div>
      <div class="seg-note">对比看 min 取谁：水面由较矮的那堵墙决定</div>
      <svg id="board" viewBox="0 0 240 170"></svg>
      <div class="legend">
        <span><i class="lg red"></i>当前 i（右边界）</span>
        <span><i class="lg blue"></i>凹槽底（被弹出）</span>
        <span><i class="lg green"></i>左边界</span>
        <span><i class="lg water"></i>已结算水量</span>
      </div>
    </div>

    <div class="card panel-card">
      <div class="panel-title" id="exTitle">例1 · 左墙矮 [2,1,3]</div>
      <div class="step-label" id="stepLabel">步骤 0 / 6</div>
      <div class="desc" id="desc">点击「下一步」开始，或按自动播放。</div>
      <div class="box">
        <div>栈（下标+高度）：<span class="mono" id="stackBox">[]</span></div>
        <div>已接水量 total：<span class="mono total" id="totalBox">0</span></div>
        <div class="calc" id="calcBox"></div>
      </div>
      <div class="ctrls">
        <button id="prev">上一步</button>
        <button id="next">下一步</button>
        <button class="play" id="play">▶ 播放</button>
        <button id="reset">重置</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var EXAMPLES = [
    {
      name: "例1 · 左墙矮 [2,1,3]",
      heights: [2,1,3],
      steps: [
        {desc:"i=0，高度2：栈空，无弹出；下标 0 入栈。", stack:"[0] (2)", total:0, cur:0, top:null, left:null, water:null},
        {desc:"i=1，高度1：栈顶高 2 > 1，不弹出；下标 1 入栈，保持递减。", stack:"[0,1] (2,1)", total:0, cur:1, top:1, left:null, water:null},
        {desc:"i=2，高度3 > 栈顶1：弹出下标 1（凹槽底）；新栈顶 0 即左边界（高2）。", stack:"[0] (2)", total:0, cur:2, top:1, left:0, water:null},
        {desc:"结算：min(2,3)=2 ← 取【左边界】高（左墙矮）。水量=(2−1)×1=1，total=1。", stack:"[0] (2)", total:1, cur:2, top:1, left:0, water:{l:0,r:2,level:2,bottom:1}},
        {desc:"栈顶 0（高2）< 3：再弹出 0；弹出后栈空 → 没有左边界，break（左侧兜不住水）。", stack:"[]", total:1, cur:2, top:0, left:null, water:null},
        {desc:"下标 2 入栈。遍历结束：total=1。", stack:"[2] (3)", total:1, cur:2, top:null, left:null, water:null}
      ]
    },
    {
      name: "例2 · 右墙矮 [3,1,2]",
      heights: [3,1,2],
      steps: [
        {desc:"i=0，高度3：入栈。", stack:"[0] (3)", total:0, cur:0, top:null, left:null, water:null},
        {desc:"i=1，高度1：栈顶 3 > 1，入栈保持递减。", stack:"[0,1] (3,1)", total:0, cur:1, top:1, left:null, water:null},
        {desc:"i=2，高度2 > 栈顶1：弹出下标 1（凹槽底）；左边界=新栈顶 0（高3）。", stack:"[0] (3)", total:0, cur:2, top:1, left:0, water:null},
        {desc:"结算：min(3,2)=2 ← 取【右边界】高（右墙矮，水面到右墙顶）。水量=(2−1)×1=1，total=1。", stack:"[0] (3)", total:1, cur:2, top:1, left:0, water:{l:0,r:2,level:2,bottom:1}},
        {desc:"栈顶 0（高3）>= 2：停止弹出；下标 2 入栈。", stack:"[0,2] (3,2)", total:1, cur:2, top:null, left:null, water:null},
        {desc:"遍历结束：total=1。", stack:"[0,2] (3,2)", total:1, cur:2, top:null, left:null, water:null}
      ]
    }
  ];

  var svg = document.getElementById("board");
  var cur = 0, step = 0, timer = null;
  var BW = 50, GAP = 70, OX = 20, BASE = 150, UNIT = 28;

  function render(){
    var ex = EXAMPLES[cur], s = ex.steps[step];
    document.getElementById("exTitle").textContent = ex.name;
    document.getElementById("stepLabel").textContent = "步骤 " + (step+1) + " / " + ex.steps.length;
    document.getElementById("desc").textContent = s.desc;
    document.getElementById("stackBox").textContent = s.stack;
    document.getElementById("totalBox").textContent = s.total;
    document.getElementById("calcBox").textContent = s.water ? "水面=" + s.water.level + "，底=" + s.water.bottom + "，宽=" + (s.water.r - s.water.l - 1) : "";

    var ns = "http://www.w3.org/2000/svg";
    svg.innerHTML = "";
    for (var i = 0; i < ex.heights.length; i++){
      var h = ex.heights[i];
      var x = OX + i*GAP, y = BASE - h*UNIT;
      var rect = document.createElementNS(ns,"rect");
      rect.setAttribute("x", x); rect.setAttribute("y", y);
      rect.setAttribute("width", BW); rect.setAttribute("height", h*UNIT);
      rect.setAttribute("fill", "#374151");
      if (s.top === i && s.water){ rect.setAttribute("fill","#d1d5db"); }
      if (s.top === i){ rect.setAttribute("stroke","#2563eb"); rect.setAttribute("stroke-width","3"); }
      if (s.cur === i){ rect.setAttribute("stroke","#e0533d"); rect.setAttribute("stroke-width","3"); }
      if (s.left === i){ rect.setAttribute("stroke","#059669"); rect.setAttribute("stroke-width","3"); }
      svg.appendChild(rect);
      var t = document.createElementNS(ns,"text");
      t.setAttribute("x", x + BW/2); t.setAttribute("y", y - 6);
      t.setAttribute("text-anchor","middle"); t.setAttribute("font-size","13"); t.setAttribute("fill","#6b7280");
      t.textContent = h;
      svg.appendChild(t);
      var idx = document.createElementNS(ns,"text");
      idx.setAttribute("x", x + BW/2); idx.setAttribute("y", BASE + 14);
      idx.setAttribute("text-anchor","middle"); idx.setAttribute("font-size","11"); idx.setAttribute("fill","#9ca3af");
      idx.textContent = "i="+i;
      svg.appendChild(idx);
    }
    if (s.water){
      var w = s.water;
      var xl = OX + w.l*GAP + BW, xr = OX + w.r*GAP;
      var yt = BASE - w.level*UNIT, yb = BASE - w.bottom*UNIT;
      var wr = document.createElementNS(ns,"rect");
      wr.setAttribute("x", xl); wr.setAttribute("y", yt);
      wr.setAttribute("width", xr-xl); wr.setAttribute("height", yb-yt);
      wr.setAttribute("fill", "#60a5fa"); wr.setAttribute("opacity","0.55");
      svg.appendChild(wr);
    }
  }

  function setStep(n){
    step = Math.max(0, Math.min(EXAMPLES[cur].steps.length-1, n));
    render();
  }

  document.getElementById("next").addEventListener("click", function(){ setStep(step+1); });
  document.getElementById("prev").addEventListener("click", function(){ setStep(step-1); });
  document.getElementById("reset").addEventListener("click", function(){ setStep(0); });
  var playBtn = document.getElementById("play");
  playBtn.addEventListener("click", function(){
    if (timer){ clearInterval(timer); timer=null; playBtn.textContent="▶ 播放"; return; }
    if (step >= EXAMPLES[cur].steps.length-1) setStep(0);
    playBtn.textContent="⏸ 暂停";
    timer = setInterval(function(){
      if (step >= EXAMPLES[cur].steps.length-1){ clearInterval(timer); timer=null; playBtn.textContent="▶ 播放"; return; }
      setStep(step+1);
    }, 1500);
  });
  var btns = document.querySelectorAll("[data-ex]");
  for (var k=0;k<btns.length;k++){
    btns[k].addEventListener("click", function(){
      if (timer){ clearInterval(timer); timer=null; playBtn.textContent="▶ 播放"; }
      cur = Number(this.getAttribute("data-ex"));
      setStep(0);
    });
  }
  render();
})();
</script>
</body>
</html>
